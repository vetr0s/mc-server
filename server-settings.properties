# Forced into server/server.properties on every run. Anything not listed here
# keeps whatever Minecraft generated.

motd=mc-server (tailnet only)
difficulty=normal
gamemode=survival
max-players=8
view-distance=12
simulation-distance=10
spawn-protection=0
online-mode=true

# Console is tmux ('make console'), so RCON stays off. Turn it on when you add
# the Discord bot: it needs rcon.password set or Minecraft disables it silently.
enable-rcon=false
rcon.port=25575
rcon.password=
